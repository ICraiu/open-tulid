[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-tulid"
version = "0.1.0"
description = "CLI tool for managing Obsidian vault projects"
requires-python = ">=3.11"
dependencies = [
    "typer",
    "rich",
    "tomli>=2.0.1; python_version < '3.11'",
    "ruamel.yaml",
]

[project.scripts]
tulid = "open_tulid.cli.main:app"

[project.optional-dependencies]
test = [
    "pytest",
    "jsonschema",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/open_tulid", "src/workflow_engine"]

[tool.hatch.build.targets.wheel.force-include]
"src/open_tulid/containers/agents/codex.Dockerfile" = "open_tulid/containers/agents/codex.Dockerfile"
"src/open_tulid/containers/agents/opencode.Dockerfile" = "open_tulid/containers/agents/opencode.Dockerfile"
