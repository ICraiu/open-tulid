schema_version: 1

storage:
  obsidian:
    boards:
      Work: kanban/Work.md
    state_mappings:
      - state: Idea
        board: Work
        column: Idea
      - state: ReadyForQuestions
        board: Work
        column: Ready for questions
      - state: Questions
        board: Work
        column: Questions
      - state: AnswersReady
        board: Work
        column: Answers ready
      - state: ReadyForSpec
        board: Work
        column: Ready for spec
      - state: ReadyForBreakdown
        board: Work
        column: Ready for breakdown
      - state: Todo
        board: Work
        column: Todo
      - state: ReadyToImplement
        board: Work
        column: Ready to implement
      - state: SelfReview
        board: Work
        column: Self review
      - state: Done
        board: Work
        column: Done

statements:
  - kind: state
    id: Idea
  - kind: state
    id: ReadyForQuestions
  - kind: state
    id: Questions
  - kind: state
    id: AnswersReady
  - kind: state
    id: ReadyForSpec
  - kind: state
    id: ReadyForBreakdown
  - kind: state
    id: Todo
  - kind: state
    id: ReadyToImplement
  - kind: state
    id: SelfReview
  - kind: state
    id: Done

  - kind: task_type
    id: ProductIdea
    instructions: [default]
    requirements:
      ReadyForQuestions:
        artifacts: [ProductSpec, TechnicalDirection]
      Done:
        artifacts: [ProductSpec, TechnicalDirection]

  - kind: task_type
    id: QuestionRound
    instructions: [default]
    requirements:
      ReadyForSpec:
        artifacts: [ClarityAssessment]
      ReadyForBreakdown:
        artifacts: [ClarityAssessment, ImplementationSpec]
      Done:
        artifacts: [ClarityAssessment]

  - kind: task_type
    id: ImplementationTask
    instructions: [default]
    requirements:
      ReadyToImplement:
        artifacts: [ImplementationContract]
      SelfReview:
        artifacts: [ImplementationContract]

  - kind: validation_type
    id: tests_pass
    args:
      command:
        type: string
  - kind: validation_type
    id: project_build
    args:
      command:
        type: string
  - kind: validation_type
    id: implementation_contract_valid
    args:
      path:
        type: string
        required: true

  - kind: artifact_type
    id: ProductSpec
    template: product-spec.md
  - kind: artifact_type
    id: TechnicalDirection
    template: technical-direction.md
  - kind: artifact_type
    id: QuestionRoundFile
  - kind: artifact_type
    id: ClarityAssessment
    template: clarity-assessment.md
  - kind: artifact_type
    id: ImplementationSpec
    template: implementation-spec.md
  - kind: artifact_type
    id: ImplementationTaskFile
  - kind: artifact_type
    id: ImplementationContract
    template: implementation-contract.yaml

  - kind: worker
    id: codex_direction
    type: codex
    instructions: [default, direction-authoring, product-template, technical-direction-template]
  - kind: worker
    id: codex_questions
    type: codex
    instructions: [default, questions-authoring]
  - kind: worker
    id: codex_clarity
    type: codex
    instructions: [default, answers-review]
  - kind: worker
    id: codex_spec
    type: codex
    instructions: [default, implementation-spec, implementation-spec-template, diagram-requirements]
  - kind: worker
    id: codex_breakdown
    type: codex
    instructions: [default, task-breakdown]
  - kind: worker
    id: codex_contract
    type: codex
    instructions: [default, execution-contract-authoring]
  - kind: worker
    id: peon-llm
    type: local_llm
    instructions: [default, peon-implementation]

  - kind: transition
    id: DraftDirection
    task_type: ProductIdea
    from: Idea
    to: ReadyForQuestions
    worker: codex_direction
    default_for_scheduler: true
    requires:
      artifacts: [ProductSpec, TechnicalDirection]

  - kind: transition
    id: GenerateQuestions
    task_type: ProductIdea
    from: ReadyForQuestions
    to: Done
    worker: codex_questions
    default_for_scheduler: true
    derives:
      task_type: QuestionRound
      state: Questions
      artifact_type: QuestionRoundFile

  - kind: transition
    id: SubmitAnswers
    task_type: QuestionRound
    from: Questions
    to: AnswersReady

  - kind: transition
    id: ReopenAnswers
    task_type: QuestionRound
    from: AnswersReady
    to: Questions

  - kind: transition
    id: ReviewAnswers
    task_type: QuestionRound
    from: AnswersReady
    to: ReadyForSpec
    worker: codex_clarity
    default_for_scheduler: true
    requires:
      artifacts: [ClarityAssessment]
    derives:
      task_type: QuestionRound
      state: Questions
      artifact_type: QuestionRoundFile
      required: false
      parent_to_if_derived: Done

  - kind: transition
    id: WriteImplementationSpec
    task_type: QuestionRound
    from: ReadyForSpec
    to: ReadyForBreakdown
    worker: codex_spec
    default_for_scheduler: true
    requires:
      artifacts: [ImplementationSpec]

  - kind: transition
    id: BreakDownImplementationSpec
    task_type: QuestionRound
    from: ReadyForBreakdown
    to: Done
    worker: codex_breakdown
    default_for_scheduler: true
    derives:
      task_type: ImplementationTask
      state: Todo
      artifact_type: ImplementationTaskFile

  - kind: transition
    id: PrepareExecutionContract
    task_type: ImplementationTask
    from: Todo
    to: ReadyToImplement
    worker: codex_contract
    default_for_scheduler: true
    requires:
      artifacts: [ImplementationContract]
      validations:
        - type: implementation_contract_valid
          args:
            path: output/implementation-contract.yaml

  - kind: transition
    id: ImplementTask
    task_type: ImplementationTask
    from: ReadyToImplement
    to: SelfReview
    worker: peon-llm
    default_for_scheduler: true
    requires:
      changed_files:
        required: true

  - kind: transition
    id: InvalidateExecutionContract
    task_type: ImplementationTask
    from: ReadyToImplement
    to: Todo

  - kind: transition
    id: InvalidateReviewedExecutionContract
    task_type: ImplementationTask
    from: SelfReview
    to: Todo

  - kind: transition
    id: SelfReview
    task_type: ImplementationTask
    from: SelfReview
    to: Done
    worker: peon-llm
    default_for_scheduler: true
    instructions: [self-review]
