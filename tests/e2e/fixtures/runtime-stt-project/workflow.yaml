schema_version: 1
storage:
  boards:
    Work: kanban/Work.md
  state_mappings:
    - state: Idea
      board: Work
      column: Idea
    - state: HumanReview
      board: Work
      column: Human review
    - state: ReadyForSpec
      board: Work
      column: Ready for spec
    - state: ReadyForBreakdown
      board: Work
      column: Ready for breakdown
    - state: Todo
      board: Work
      column: Todo
    - state: ReadyToImplement
      board: Work
      column: Ready to implement
    - state: SelfReview
      board: Work
      column: Self review
    - state: Done
      board: Work
      column: Done
statements:
  - kind: state
    id: Idea
  - kind: state
    id: HumanReview
  - kind: state
    id: ReadyForSpec
  - kind: state
    id: ReadyForBreakdown
  - kind: state
    id: Todo
  - kind: state
    id: ReadyToImplement
  - kind: state
    id: SelfReview
  - kind: state
    id: Done
  - kind: task_type
    id: ProductIdea
    instructions: [default]
  - kind: task_type
    id: ImplementationTask
    instructions: [default]
    requirements:
      ReadyToImplement:
        artifacts: [ImplementationContract]
      SelfReview:
        artifacts: [ImplementationContract]
  - kind: validation_type
    id: tests_pass
    args:
      command:
        type: string
  - kind: validation_type
    id: project_build
    args:
      command:
        type: string
  - kind: validation_type
    id: implementation_contract_valid
    args:
      path:
        type: string
        required: true
  - kind: artifact_type
    id: ProductSpec
    template: product-spec.md
  - kind: artifact_type
    id: TechnicalDirection
    template: technical-direction.md
  - kind: artifact_type
    id: ImplementationSpec
    template: implementation-spec.md
  - kind: artifact_type
    id: ImplementationTaskFile
  - kind: artifact_type
    id: ImplementationContract
    template: implementation-contract.yaml
  - kind: worker
    id: codex_direction
    type: codex
    instructions: [default]
  - kind: worker
    id: codex_spec
    type: codex
    instructions: [default]
  - kind: worker
    id: codex_breakdown
    type: codex
    instructions: [default]
  - kind: worker
    id: codex_contract
    type: codex
    instructions: [default]
  - kind: worker
    id: qwen_27b
    type: local_llm
    instructions: [default]
  - kind: transition
    id: DraftDirection
    task_type: ProductIdea
    from: Idea
    to: HumanReview
    worker: codex_direction
    default_for_scheduler: true
    requires:
      artifacts: [ProductSpec, TechnicalDirection]
  - kind: transition
    id: ApproveDirection
    task_type: ProductIdea
    from: HumanReview
    to: ReadyForSpec
  - kind: transition
    id: WriteImplementationSpec
    task_type: ProductIdea
    from: ReadyForSpec
    to: ReadyForBreakdown
    worker: codex_spec
    default_for_scheduler: true
    requires:
      artifacts: [ImplementationSpec]
  - kind: transition
    id: BreakDownImplementationSpec
    task_type: ProductIdea
    from: ReadyForBreakdown
    to: Done
    worker: codex_breakdown
    default_for_scheduler: true
    derives:
      task_type: ImplementationTask
      state: Todo
      artifact_type: ImplementationTaskFile
  - kind: transition
    id: PrepareExecutionContract
    task_type: ImplementationTask
    from: Todo
    to: ReadyToImplement
    worker: codex_contract
    default_for_scheduler: true
    requires:
      artifacts: [ImplementationContract]
      validations:
        - type: implementation_contract_valid
          args:
            path: output/implementation-contract.yaml
  - kind: transition
    id: ImplementTask
    task_type: ImplementationTask
    from: ReadyToImplement
    to: SelfReview
    worker: qwen_27b
    default_for_scheduler: true
    requires:
      changed_files:
        required: true
      validations:
        - type: tests_pass
          args:
            command: python check_repo.py tests
        - type: project_build
          args:
            command: python check_repo.py build
  - kind: transition
    id: SelfReview
    task_type: ImplementationTask
    from: SelfReview
    to: Done
    worker: qwen_27b
    default_for_scheduler: true
    requires:
      validations:
        - type: tests_pass
          args:
            command: python check_repo.py tests
        - type: project_build
          args:
            command: python check_repo.py build
  - kind: transition
    id: InvalidateExecutionContract
    task_type: ImplementationTask
    from: ReadyToImplement
    to: Todo
  - kind: transition
    id: InvalidateReviewedExecutionContract
    task_type: ImplementationTask
    from: SelfReview
    to: Todo
