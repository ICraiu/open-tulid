schema_version: 1
statements:
  - kind: state
    id: Todo
  - kind: task_type
    id: CodingTask
  - kind: validation_type
    id: check
    args:
      count:
        type: integer
        required: true
  - kind: transition
    id: T
    task_type: CodingTask
    from: Todo
    to: Todo
    requires:
      validations:
        - type: check
          args:
            count: not-an-int
